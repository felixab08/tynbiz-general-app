<div class="dark:bg-gray-700 dark:text-white">
  <div class="mb-6">
    <h1 class="text-2xl font-semibold mb-2">Contactos</h1>
  </div>
</div>
  <tyn-filter
    [filterMenu]="filterMenu()"
    placeholder="Buscar"
    [currentPage]="_paginationService.currentPage()"
    [currentSize]="_paginationService.currentSize()"
    [currentSearchTerm]="_paginationService.currentSearchTerm()"
  ></tyn-filter>


<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4">
  @if (contactResorce.hasValue()) {
    @for (item of contactResorce.value().content; track item.id) {
      <tyn-card-contact-store-page
        [listContact]="item"
      ></tyn-card-contact-store-page>
    }
  }
</div>
@if (contactResorce.hasValue()) {
  <app-pagination
    [pages]="contactResorce.value().totalPages"
    [totalElements]="contactResorce.value().totalElements"
    [currentPage]="_paginationService.currentPage()"
    [currentSize]="_paginationService.currentSize()"
  />
}
